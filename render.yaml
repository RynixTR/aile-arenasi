services:
  - type: web
    name: aile-arenasi
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aile-arenasi-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: aile-arenasi-db
    plan: free
    databaseName: aile_arenasi
    user: aile_arenasi
